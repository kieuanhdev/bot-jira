# Team Task Web — Podman / Docker Compose
#
#   podman compose up -d --build
#   docker compose up -d --build
#
# Brings up: postgres (db), web app, and worker.
# Real secrets and configuration are read directly from .env.
# Intra-cluster DATABASE_URL connects web and worker to db inside the container network.

name: teamweb

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamweb
      POSTGRES_PASSWORD: teamweb
      POSTGRES_DB: teamweb
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamweb -d teamweb"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Intra-cluster URL (service name on the teamweb network)
      DATABASE_URL: postgresql://teamweb:teamweb@db:5432/teamweb
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3100}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    ports:
      - "${PORT:-3100}:${PORT:-3100}"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Intra-cluster URL (service name on the teamweb network)
      DATABASE_URL: postgresql://teamweb:teamweb@db:5432/teamweb
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}

volumes:
  pgdata:
